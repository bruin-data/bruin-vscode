name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Setup Node.js
      uses: actions/setup-node@v7.1.0
      with:
        node-version: '22.14.0'

    - name: Install dependencies with npm@11 (for min-release-age support)
      run: |
        npx npm@11.10.0 ci
        cd webview-ui && npx npm@11.10.0 ci

    - name: Install vsce and ovsx
      run: npm install -g @vscode/vsce ovsx

    - name: Build extension
      run: |
        npm run compile
        npm run build:webview

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Update package.json version
      run: |
        npm version ${{ steps.get_version.outputs.VERSION }} --no-git-tag-version --allow-same-version

    - name: Package extension
      run: vsce package

    - name: Publish to Open-VSX
      run: ovsx publish bruin-${{ steps.get_version.outputs.VERSION }}.vsix -p ${{ secrets.OVSX_PAT }}
      env:
        OVSX_PAT: ${{ secrets.OVSX_PAT }}

    # Temporarily disabled: the VSCE_PAT has expired and publishing fails.
    # Re-enable once a fresh Marketplace PAT is generated and stored in secrets.VSCE_PAT.
